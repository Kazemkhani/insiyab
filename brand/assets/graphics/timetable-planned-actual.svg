<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Illustrative planned and actual timetable</title><desc id="desc">A fictional scheduled ten minute segment takes sixteen minutes. The additional six minutes is explicitly labeled as delay.</desc>
<rect width="960" height="400" fill="#F7F5F0"/>
<text x="40" y="45" font-family="IBM Plex Sans, sans-serif" font-size="15" letter-spacing="1.8" fill="#15181D">PLANNED AND ACTUAL</text>
<text x="40" y="94" font-family="Instrument Serif, serif" font-size="38" fill="#15181D">The delay stays visible.</text>
<path d="M230 135V295" fill="none" stroke="#15181D" stroke-opacity="0.14" stroke-width="1"/>
<text x="230" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#15181D">09:00</text>
<path d="M380 135V295" fill="none" stroke="#15181D" stroke-opacity="0.14" stroke-width="1"/>
<text x="380" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#15181D">09:05</text>
<path d="M530 135V295" fill="none" stroke="#15181D" stroke-opacity="0.14" stroke-width="1"/>
<text x="530" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#15181D">09:10</text>
<path d="M680 135V295" fill="none" stroke="#15181D" stroke-opacity="0.14" stroke-width="1"/>
<text x="680" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#15181D">09:15</text>
<path d="M830 135V295" fill="none" stroke="#15181D" stroke-opacity="0.14" stroke-width="1"/>
<text x="830" y="325" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#15181D">09:20</text>
<text x="40" y="180" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#15181D">Planned</text>
<rect x="230" y="160" width="300" height="26" fill="none" stroke="#15181D" stroke-width="2"/>
<text x="40" y="257" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#15181D">Actual</text>
<rect x="230" y="237" width="300" height="26" fill="#15181D"/>
<rect x="530" y="237" width="180" height="26" fill="#C42B2B"/>
<path d="M530 218V209H710V218" stroke="#C42B2B" stroke-width="1.5" fill="none"/>
<text x="620" y="197" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="500" fill="#C42B2B">+6 min</text>
<text x="40" y="375" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#15181D">Source: illustrative fictional service · common time origin and scale · no performance claim</text>
</svg>

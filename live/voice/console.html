<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insiyab Drill Console</title>
<style>
:root {
  --paper: #F6F5F1;
  --ink:   #12263A;
  --flow:  #0E5A5A;
  --over:  #B23A2E;
  --sim:   #8A5A00;
  --muted: #6B7F8F;
  --gap:   1.5rem;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; }
body { display: flex; flex-direction: column; padding: var(--gap); min-height: 720px; min-width: 1280px; }

/* drill banner - always visible */
#drill-banner {
  background: var(--over);
  color: #fff;
  text-align: center;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.25em;
  padding: 0.5rem;
  border-radius: 4px;
  margin-bottom: var(--gap);
  flex-shrink: 0;
}

#main { display: flex; flex-direction: column; flex: 1; gap: var(--gap); }

/* incident block */
#incident {
  background: var(--ink);
  color: var(--paper);
  border-radius: 6px;
  padding: 1rem 1.5rem;
  flex-shrink: 0;
}
#incident h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; color: #fff; }
#incident .meta { font-size: 0.85rem; color: #aec; display: flex; flex-wrap: wrap; gap: 1rem; }
#incident .meta span { opacity: 0.85; }
#incident .source-label { font-size: 0.75rem; color: var(--sim); margin-top: 0.3rem; }

/* three staff columns */
#staff-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--gap);
  flex-shrink: 0;
}
.staff-card {
  border: 2px solid #d4d0c8;
  border-radius: 6px;
  padding: 1rem;
  min-height: 110px;
  position: relative;
  transition: border-color 0.3s;
}
.staff-card.reported { border-color: var(--flow); }
.staff-card.no-answer { border-color: var(--muted); opacity: 0.7; }
.staff-card h2 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
.staff-card .report-text { font-size: 0.95rem; color: var(--ink); line-height: 1.4; }
.staff-card .status-dot {
  position: absolute; top: 1rem; right: 1rem;
  width: 10px; height: 10px; border-radius: 50%;
  background: #d4d0c8;
}
.staff-card.reported .status-dot { background: var(--flow); }
.staff-card.no-answer .status-dot { background: var(--muted); }
.staff-card .ts { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }

/* decision block */
#decision {
  border-radius: 6px;
  padding: 1.2rem 1.5rem;
  border: 2px solid #d4d0c8;
  flex-shrink: 0;
  min-height: 90px;
}
#decision h2 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
#decision .decision-text { font-size: 1.5rem; font-weight: 700; color: var(--flow); line-height: 1.3; }
#decision .decision-text.empty { color: #ccc; font-size: 1rem; font-weight: 400; }
#decision .decision-words { font-size: 0.9rem; color: var(--ink); margin-top: 0.4rem; }
#decision .ts { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }
#decision.decided { border-color: var(--flow); }

/* acknowledgements */
#acks {
  display: flex; gap: 1rem; flex-wrap: wrap; flex-shrink: 0;
}
.ack-pill {
  font-size: 0.8rem;
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  background: #d4d0c8;
  color: var(--ink);
  transition: background 0.3s;
}
.ack-pill.acked { background: var(--flow); color: #fff; }

/* status bar */
#status-bar { font-size: 0.75rem; color: var(--muted); margin-top: auto; padding-top: 0.5rem; display: flex; justify-content: space-between; }

/* phase label */
#phase { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
#phase.idle { color: var(--muted); }
#phase.check { color: var(--sim); }
#phase.manager { color: var(--sim); }
#phase.callout { color: var(--flow); }
#phase.done { color: var(--flow); }

/* options list in idle state */
#options-list { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
#options-list span { display: block; }
</style>
</head>
<body>

<div id="drill-banner">DRILL | RTA FUTURE MOVE HACKATHON | SIMULATED INCIDENT | NOT REAL OPERATIONS</div>

<div id="main">
  <div id="incident">
    <h1 id="inc-title">Waiting for incident&hellip;</h1>
    <div class="meta">
      <span id="inc-route"></span>
      <span id="inc-time"></span>
      <span id="inc-late"></span>
      <span id="inc-boardings"></span>
      <span id="inc-buses"></span>
    </div>
    <div id="options-list"></div>
    <div class="source-label" id="inc-source"></div>
  </div>

  <div id="staff-row">
    <div class="staff-card" id="card-driver">
      <div class="status-dot"></div>
      <h2>Driver</h2>
      <div class="report-text" id="report-driver">Waiting&hellip;</div>
      <div class="ts" id="ts-driver"></div>
    </div>
    <div class="staff-card" id="card-depot">
      <div class="status-dot"></div>
      <h2>Depot</h2>
      <div class="report-text" id="report-depot">Waiting&hellip;</div>
      <div class="ts" id="ts-depot"></div>
    </div>
    <div class="staff-card" id="card-station">
      <div class="status-dot"></div>
      <h2>Station supervisor</h2>
      <div class="report-text" id="report-station">Waiting&hellip;</div>
      <div class="ts" id="ts-station"></div>
    </div>
  </div>

  <div id="decision">
    <h2>Duty manager decision</h2>
    <div class="decision-text empty" id="dec-text">Awaiting decision&hellip;</div>
    <div class="decision-words" id="dec-words" style="display:none"></div>
    <div class="ts" id="dec-ts"></div>
  </div>

  <div id="acks">
    <div class="ack-pill" id="ack-driver">Driver</div>
    <div class="ack-pill" id="ack-depot">Depot</div>
    <div class="ack-pill" id="ack-station">Station</div>
  </div>
</div>

<div id="status-bar">
  <span id="phase" class="idle">IDLE</span>
  <span id="last-update">Not connected</span>
</div>

<script>
(function () {
  'use strict';

  // Read the relay server port from ?port=N or default
  const params = new URLSearchParams(location.search);
  const port = params.get('port') || '7890';
  const STATE_URL = 'http://127.0.0.1:' + port + '/voice/state';
  const POLL_MS = 2500;

  function fmt(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) { return iso.slice(11, 19) || ''; }
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function setAttr(id, attr, val) {
    const el = document.getElementById(id);
    if (el) el.setAttribute(attr, val);
  }

  function addClass(id, cls) {
    const el = document.getElementById(id);
    if (el && !el.classList.contains(cls)) el.classList.add(cls);
  }

  function removeClass(id, cls) {
    const el = document.getElementById(id);
    if (el) el.classList.remove(cls);
  }

  function renderState(s) {
    // Incident
    if (s.incident) {
      const inc = s.incident;
      setText('inc-title', 'Route ' + inc.route + ', direction ' + inc.direction + ', ' + inc.hour);
      setText('inc-route', 'Route ' + inc.route);
      setText('inc-time', 'Scheduled ' + inc.hour);
      setText('inc-late', inc.minutes_late_now + ' min late now');
      setText('inc-boardings', inc.boardings_this_hour + ' boardings this hour');
      setText('inc-buses', inc.buses_running + ' buses running (rule: ' + inc.buses_needed_by_rule + ')');
      if (inc.source) setText('inc-source', 'Source: ' + inc.source);
      if (inc.options && inc.options.length) {
        const el = document.getElementById('options-list');
        if (el) {
          el.innerHTML = inc.options.map(function (o) {
            return '<span>' + escHtml(o.key) + ': ' + escHtml(o.say) + '</span>';
          }).join('');
        }
      }
    }

    // Phase
    const ph = s.phase || 'idle';
    const phEl = document.getElementById('phase');
    if (phEl) {
      phEl.textContent = ph.toUpperCase().replace('CALLOUT', 'CALL BACK');
      phEl.className = ph;
    }

    // Staff reports from timeline
    const roles = ['driver', 'depot', 'station'];
    roles.forEach(function (role) {
      const card = document.getElementById('card-' + role);
      const repEl = document.getElementById('report-' + role);
      const tsEl = document.getElementById('ts-' + role);
      if (!card) return;

      // Find latest report or no-answer for this role in timeline
      var reportEv = null, noAnswerEv = null;
      (s.timeline || []).forEach(function (ev) {
        if (ev.role !== role) return;
        if (ev.event === 'report') reportEv = ev;
        if (ev.event === 'no_answer') noAnswerEv = ev;
      });

      if (reportEv) {
        card.classList.remove('no-answer');
        addClass('card-' + role, 'reported');
        if (repEl) repEl.textContent = reportEv.report;
        if (tsEl) tsEl.textContent = fmt(reportEv.at);
      } else if (noAnswerEv) {
        card.classList.remove('reported');
        addClass('card-' + role, 'no-answer');
        if (repEl) repEl.textContent = 'No answer';
        if (tsEl) tsEl.textContent = fmt(noAnswerEv.at);
      } else {
        card.classList.remove('reported', 'no-answer');
        if (repEl) repEl.textContent = s.phase === 'idle' ? '...' : 'Waiting...';
        if (tsEl) tsEl.textContent = '';
      }
    });

    // Decision
    const decEl = document.getElementById('dec-text');
    const decWords = document.getElementById('dec-words');
    const decTs = document.getElementById('dec-ts');
    const decBlock = document.getElementById('decision');
    if (s.decision) {
      if (decEl) { decEl.textContent = s.decision.say; decEl.classList.remove('empty'); }
      if (decWords && s.decision.words) { decWords.textContent = s.decision.words; decWords.style.display = ''; }
      else if (decWords) { decWords.style.display = 'none'; }
      if (decTs) decTs.textContent = fmt(s.decision.at);
      if (decBlock) decBlock.classList.add('decided');
    } else {
      if (decEl) { decEl.textContent = 'Awaiting decision…'; decEl.classList.add('empty'); }
      if (decWords) { decWords.style.display = 'none'; }
      if (decTs) decTs.textContent = '';
      if (decBlock) decBlock.classList.remove('decided');
    }

    // Acknowledgements
    roles.forEach(function (role) {
      const pill = document.getElementById('ack-' + role);
      if (!pill) return;
      const acked = s.acknowledgements && s.acknowledgements[role];
      if (acked) pill.classList.add('acked');
      else pill.classList.remove('acked');
    });

    // Last update
    const luEl = document.getElementById('last-update');
    if (luEl) luEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
  }

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function poll() {
    fetch(STATE_URL, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(renderState)
      .catch(function (e) {
        const lu = document.getElementById('last-update');
        if (lu) lu.textContent = 'Connection error, retrying (' + new Date().toLocaleTimeString() + ')';
      });
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
